version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hdhive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hdhive_secret}
      POSTGRES_DB: hdhive
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hdhive-api:
    build: .
    image: hdhive-api:latest
    container_name: hdhive-api
    restart: unless-stopped
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 必需：保护 API 的 token
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-test-token-local}

      # 可选：默认 cookie（如果设置，会自动保存到数据库）
      - HDHIVE_COOKIE=${HDHIVE_COOKIE:-}

      # 可选：登录后的 bindSecret（2026-07 改版后必须，否则 customer API 401）
      - HDHIVE_BIND_SECRET=${HDHIVE_BIND_SECRET:-}

      # 可选：cookie 缺失/不完整时自动登录并保存到数据库
      - HDHIVE_USERNAME=${HDHIVE_USERNAME:-}
      - HDHIVE_PASSWORD=${HDHIVE_PASSWORD:-}
      - AUTO_LOGIN=${AUTO_LOGIN:-true}

      # 代理：直连被 Cloudflare 拦时必须设，例如 socks5://host:1080
      - HDHIVE_PROXY=${HDHIVE_PROXY:-}
      - BROWSER_PROXY=${HDHIVE_PROXY:-}

      # 加密密钥（用于数据库存储 cookie）
      - BRIDGE_STATE_SECRET=${BRIDGE_STATE_SECRET:-change-me-in-production}

      # Postgres 连接（启用数据库持久化）
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-hdhive_secret}@postgres:5432/hdhive

      # cookie 存储 key（多实例时区分）
      - COOKIE_KEY=${COOKIE_KEY:-default}

      # 可选：影巢基础 URL
      - HDHIVE_BASE_URL=${HDHIVE_BASE_URL:-https://hdhive.com}

      # 可选：浏览器配置
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}

      # 可选：单个接口超时（毫秒）
      - ACTION_TIMEOUT_MS=${ACTION_TIMEOUT_MS:-180000}

      # 可选：是否启动时自动预热
      - AUTO_WARMUP=${AUTO_WARMUP:-true}

      # hybrid: auto=pure优先回落浏览器, pure=仅pure, browser=仅浏览器
      - HYBRID_MODE=${HYBRID_MODE:-auto}
      # 默认不预热 Chromium（pure 就绪即可对外）
      - AUTO_WARMUP_BROWSER=${AUTO_WARMUP_BROWSER:-false}

      # 可选：签到验证码 AI 配置
      - CAPTCHA_AI_BASE_URL=${CAPTCHA_AI_BASE_URL:-}
      - CAPTCHA_AI_API_KEY=${CAPTCHA_AI_API_KEY:-}
      - CAPTCHA_AI_MODEL=${CAPTCHA_AI_MODEL:-web2api/gemini-auto}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-}

    volumes:
      - hdhive-data:/tmp/hdhive-cache

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  hdhive-data:
    driver: local
